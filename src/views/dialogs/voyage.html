<dialog id="finish" aria-labelledby="finish-title">
  <div class="end-art"><canvas id="arrival" width="800" height="188" aria-hidden="true"></canvas></div>
  <p class="eyebrow" id="finish-kicker"></p>
  <h2 id="finish-title"></h2>
  <p id="finish-text"></p>
  <p id="best"></p>
  <div class="finish-actions">
    <button id="next" class="action-btn"></button
    ><button data-action="restart" class="text-btn">Rejouer cette escale</button>
  </div>
</dialog>
<dialog id="return-home" role="alertdialog" aria-labelledby="return-title" aria-describedby="return-text">
  <h2 id="return-title">Recommencer la traversée ?</h2>
  <p id="return-text">
    Vous reviendrez à l’accueil. Les trois escales repartiront de zéro. Vos robots, vos réglages et vos meilleurs
    trajets seront conservés.
  </p>
  <div class="return-actions">
    <button id="keep-playing" autofocus>Garder ma partie</button
    ><button id="confirm-home" class="action-btn">Revenir et recommencer</button>
  </div>
</dialog>
