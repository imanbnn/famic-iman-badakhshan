name: Vérifier le jeu
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  partie:
    name: Partie hors ligne (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: node tools/build.mjs
      - run: git diff --exit-code -- dist/index.html
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - run: node tests/browser/run.mjs

  autres-navigateurs:
    name: Partie hors ligne (${{ matrix.navigateur }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user pwuser
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        navigateur: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - run: node tests/browser/run.mjs
        env:
          CONTREFLOT_BROWSER: ${{ matrix.navigateur }}

  fluidite:
    name: Mesurer la fluidité (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - name: Comparer les deux builds hors ligne sur la même machine
        run: |
          if git cat-file -e HEAD^:dist/index.html 2>/dev/null; then
            previous="$RUNNER_TEMP/contreflot-precedent.html"
            git show HEAD^:dist/index.html > "$previous"
            node tests/performance/frame-times.mjs "$previous"
          else
            node tests/performance/frame-times.mjs
          fi

  publication:
    name: Publier le jeu autonome
    needs: [partie, autres-navigateurs, fluidite]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Joindre le fichier HTML à la version du jeu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          cp dist/index.html Contreflot.html
          gh release create "$tag" Contreflot.html --target "$GITHUB_SHA" --title "Contreflot ${tag}" --notes "Ouvrez Contreflot.html dans votre navigateur pour jouer hors ligne. Les commandes et les règles sont dans le README."
